<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoPad</title>

<style>
:root {
    --bg: #0b0710;
    --purple: #7a2cff;
    --purple2: #b57edc;
    --text: #f4eaff;
    --muted: rgba(244,234,255,0.7);
}

body {
    margin: 0;
    font-family: system-ui;
    background: radial-gradient(circle at top, #1a0b2e, var(--bg));
    color: var(--text);
}

/* NAV */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
}

.logo {
    font-weight: 700;
    color: var(--purple2);
}

nav a {
    color: var(--muted);
    margin-left: 18px;
    text-decoration: none;
}

nav a:hover { color: white; }

/* HERO */
.hero {
    text-align: center;
    padding: 100px 20px 60px;
}

.hero h1 {
    font-size: 56px;
    margin: 0;
    color: var(--purple2);
}

.price {
    font-size: 22px;
    margin-top: 10px;
    color: white;
}

.small {
    color: var(--muted);
    margin-top: 5px;
}

/* BUTTONS */
.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 26px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--purple), #4b00c2);
    color: white;
    text-decoration: none;
    font-weight: 600;
    transition: 0.2s;
}

.btn:hover {
    transform: scale(1.05);
}

.btn-secondary {
    background: transparent;
    border: 1px solid var(--purple2);
    margin-left: 10px;
}
</style>
</head>

<body>

<nav>
    <div class="logo">GeoPad</div>
    <div>
        <a href="#features">Features</a>
        <a href="#about">About</a>
        <a href="shop.html">Shop</a>
    </div>
</nav>

<section class="hero">
    <h1>GeoPad</h1>

    <div class="price" id="priceText">$40 AUD</div>
    <div class="small" id="regionText">Loading region...</div>

    <p style="color: rgba(244,234,255,0.7); max-width:600px; margin:auto;">
        A precision DIY handheld designed for open hardware experimentation and Geometry Dash performance control.
    </p>

    <a class="btn" href="shop.html">Buy Now</a>
    <a class="btn btn-secondary" href="shop.html">View Product</a>
</section>

<script>
/* Simple country detection (NOT perfect, but works well enough) */
fetch("https://ipapi.co/json/")
.then(res => res.json())
.then(data => {
    const country = data.country_code;

    const priceText = document.getElementById("priceText");
    const regionText = document.getElementById("regionText");

    if (country === "US") {
        priceText.innerText = "$30 USD";
        regionText.innerText = "Detected: United States";
    } else {
        priceText.innerText = "$40 AUD";
        regionText.innerText = "Detected: Outside US (AUD pricing)";
    }
})
.catch(() => {
    document.getElementById("regionText").innerText = "Region detection unavailable";
});
</script>

</body>
</html>
