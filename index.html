<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoPad</title>

<style>
:root {
    --bg: #0b0710;
    --purple: #7a2cff;
    --purple2: #b57edc;
    --text: #f4eaff;
    --muted: rgba(244,234,255,0.7);
}

body {
    margin: 0;
    font-family: system-ui;
    background: radial-gradient(circle at top, #1a0b2e, var(--bg));
    color: var(--text);
}

/* NAV */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
}

.logo {
    font-weight: 700;
    color: var(--purple2);
}

nav a {
    color: var(--muted);
    margin-left: 18px;
    text-decoration: none;
}

nav a:hover {
    color: white;
}

/* HERO */
.hero {
    text-align: center;
    padding: 100px 20px 60px;
}

.hero h1 {
    font-size: 56px;
    margin: 0;
    color: var(--purple2);
}

.price {
    font-size: 22px;
    margin-top: 10px;
}

.buttons {
    margin-top: 20px;
}

.btn {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--purple), #4b00c2);
    color: white;
    text-decoration: none;
    font-weight: 600;
    margin: 5px;
    transition: 0.2s;
}

.btn:hover {
    transform: scale(1.05);
}

.btn-outline {
    background: transparent;
    border: 1px solid var(--purple2);
}
</style>
</head>

<body>

<nav>
    <div class="logo">GeoPad</div>
    <div>
        <a href="#features">Features</a>
        <a href="#about">About</a>
        <a href="shop.html">Shop</a>
    </div>
</nav>

<section class="hero">
    <h1>GeoPad</h1>

    <div class="price" id="price">Loading...</div>

    <p style="max-width:600px;margin:20px auto;color:rgba(244,234,255,0.7);">
        A precision DIY handheld designed for open hardware experimentation and high-performance Geometry Dash control.
    </p>

    <div class="buttons">
        <a class="btn" href="shop.html">Buy Now</a>
        <a class="btn btn-outline" href="shop.html">View Product</a>
    </div>
</section>

<script>
async function setPrice() {
    try {
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();

        if (data.country_code === "US") {
            document.getElementById("price").innerText = "$30 USD";
        } else {
            document.getElementById("price").innerText = "$40 AUD";
        }
    } catch {
        document.getElementById("price").innerText = "$40 AUD";
    }
}

setPrice();
</script>

</body>
</html>
